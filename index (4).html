<style>

<script>

  MEDV:{g:["prodeje léku na alergii rostly","uzavřela licenci s firmou v Německu","snížila výrobní náklady"],b:["konkurence vydala levnější lék","drahé klinické studie","výpadek ve výrobním závodě"]},

};
const MONTHS=60, FEE_PCT=.002, FEE_MIN=30, CASH_RATE=.0025;
const MN=["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
const monthName=m=>MN[m%12]+" "+(1+Math.floor(m/12))+". roku";
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function newGame(deposit,guided){
  const crash=rint(22,40), bubble=rint(8,18), rates=rint(10,30), pharma=rint(14,44);
  const px={},fair={},hist={};
  for(const a of ASSETS){const p=a.etf?1000:rint(150,1800);px[a.id]=p;fair[a.id]=p;hist[a.id]=[p]}
  return{m:0,cash:100000,deposit,hold:{},cost:{},px,fair,hist,
    plan:{crash,bubble,rates,pharma,pharmaOk:Math.random()<.55},
    bench:{units:100000/px.SVET,save:100000},vals:[100000],benchVals:[100000],saveVals:[100000],
    fees:0,trades:0,soldInCrash:0,boughtBubbleTop:0,divs:0,unlocked:[],qi:0,qo:null,ok:0,bad:0,guided:!!guided,step:0,drip:false,reinvested:0,divBy:{},results:{},seenResults:false,
    news:[{m:0,t:"Vítej na burze. Máš 100 000 Kč"+(deposit?" a každý měsíc přidáš "+deposit.toLocaleString("cs-CZ")+" Kč":"")+". Za 5 let uvidíme, jestli porazíš index Svět 500.",k:"edu"}],done:false};
}
function portfolioValue(G){let v=G.cash;for(const id in G.hold)v+=G.hold[id]*G.px[id];return v}
/* one month of market */
function stepMonth(G){
  const m=++G.m, P=G.plan, news=[];
  let mkt=.03*gauss()*.6;
  const eff={};ASSETS.forEach(a=>eff[a.id]=0);
  // crash: two bad months, then strong recovery for a year
  if(m===P.crash-1)news.push({t:"Analytici varují: ceny akcií jsou vysoko a ekonomika zpomaluje.",k:"neg"});
  if(m===P.crash){mkt-=.17;news.push({t:"KRACH! Burzy po celém světě padají. Lidé ve strachu prodávají.",k:"neg"})}
  if(m===P.crash+1){mkt-=.09;news.push({t:"Propad pokračuje. Média píšou o konci světa.",k:"neg"})}
  if(m>P.crash+1&&m<=P.crash+13){mkt+=.022;if(m===P.crash+3)news.push({t:"Trhy se začínají vzpamatovávat. Kdo vydržel, dohání ztráty.",k:"pos"})}
  // rate hike
  if(m===P.rates-1)news.push({t:"Příští měsíc zasedá centrální banka. Čeká se zvýšení úrokových sazeb.",k:"edu"});
  if(m===P.rates){news.push({t:"Centrální banka zvedla úrokové sazby. Bankám to pomáhá, stavebním firmám a hypotékám ne.",k:"neg"});ASSETS.forEach(a=>{if(a.rate)eff[a.id]+=a.rate*.09});mkt-=.02}
  // pharma
  if(m===P.pharma-2)news.push({t:"MedVia Pharma čeká rozhodnutí úřadů o novém léku. Výsledek za dva měsíce.",k:"edu"});
  if(m===P.pharma){if(P.pharmaOk){eff.MEDV+=.35;G.fair.MEDV*=1.35;news.push({t:"MedVia Pharma: nový lék schválen! Akcie letí nahoru.",k:"pos"})}else{eff.MEDV-=.3;G.fair.MEDV*=.72;news.push({t:"MedVia Pharma: lék neschválen. Akcie se propadají.",k:"neg"})}}
  // Nebula bubble
  const b=P.bubble;
  if(m>=b&&m<b+5){eff.NEBU+=.22;if(m===b)news.push({t:"Nebula AI je hit sociálních sítí. Všichni kupují, „tohle poletí na Měsíc“.",k:"pos"});if(m===b+3)news.push({t:"Nebula AI za pár měsíců zdvojnásobila cenu. P/E přes 150. Zkušení investoři varují před bublinou.",k:"edu"})}
  if(m===b+5){eff.NEBU-=.42;news.push({t:"Bublina praskla. Nebula AI nesplnila sliby a akcie padá o desítky procent.",k:"neg"})}
  if(m===b+6)eff.NEBU-=.15;
  // quarterly results season (months 1,4,7,10 of each year)
  if(m%3===1){const rows=[];
    for(const a of ASSETS){if(a.etf)continue;
      const exp=G.fair[a.id]/a.pe/4;let sur=Math.max(-.3,Math.min(.3,gauss()*.1));
      const hype=a.id==="NEBU"&&m>=b&&m<b+5;if(hype)sur=Math.min(sur,-.04);
      if(!hype){eff[a.id]+=sur*.6;G.fair[a.id]*=1+sur*.3}
      const rev=a.drift*12+sur*.4;
      const pool=WHY[a.id][sur>=0?"g":"b"];const why=pool[Math.floor(Math.random()*pool.length)];
      G.results[a.id]={m,exp,act:exp*(1+sur),sur,rev,why};rows.push({id:a.id,n:a.n,exp,act:exp*(1+sur),sur,rev,hype,why})}
    news.push({t:"Výsledková sezóna: firmy zveřejnily hospodaření za uplynulé čtvrtletí.",k:"res",rows})}
  // prices
  for(const a of ASSETS){
    G.fair[a.id]*=1+a.drift;
    const gap=Math.log(G.fair[a.id]/G.px[a.id]);
    let r=a.drift+a.beta*mkt+(a.etf?.004:a.vol)*gauss()*.7+eff[a.id]+(a.etf?0:.08*gap);
    r=Math.max(-.6,Math.min(.6,r));
    G.px[a.id]=Math.max(1,G.px[a.id]*(1+r));G.hist[a.id].push(G.px[a.id]);
  }
  // dividends: paid every quarter, optionally reinvested (DRIP)
  if(m%3===0){const list=[];let tot=0;
    for(const id in G.hold){const a=ASSETS.find(x=>x.id===id);if(!a.div)continue;
      const amt=G.hold[id]*G.px[id]*a.div/4;if(amt<=0)continue;tot+=amt;G.divBy[id]=(G.divBy[id]||0)+amt;
      if(G.drip){G.hold[id]+=amt/G.px[id];G.cost[id]=(G.cost[id]||0)+amt;G.reinvested+=amt}else G.cash+=amt;
      list.push({n:a.n,amt})}
    if(tot>0){G.divs+=tot;news.push({t:"Dividendy: připsáno "+Math.round(tot).toLocaleString("cs-CZ")+" Kč"+(G.drip?", automaticky reinvestováno do stejných akcií.":" na účet jako hotovost."),k:"div",list})}}
  G.cash+=Math.max(0,G.cash)*CASH_RATE;
  G.cash+=G.deposit;
  // benchmarks
  G.bench.units+=G.deposit/G.px.SVET;G.bench.save=G.bench.save*(1+CASH_RATE)+G.deposit;
  G.vals.push(portfolioValue(G));G.benchVals.push(G.bench.units*G.px.SVET);G.saveVals.push(G.bench.save);
  news.forEach(n=>G.news.unshift({m,...n}));G.news=G.news.slice(0,40);
  if(m>=MONTHS)G.done=true;
}
const pe=(G,a)=>a.pe*G.px[a.id]/G.fair[a.id];
const fee=amt=>Math.max(FEE_MIN,amt*FEE_PCT);
function buy(G,id,amt){const f=fee(amt);if(amt<=0||amt+f>G.cash+1e-6)return false;G.cash-=amt+f;G.fees+=f;G.trades++;G.hold[id]=(G.hold[id]||0)+amt/G.px[id];G.cost[id]=(G.cost[id]||0)+amt+f;
  if(id==="NEBU"&&G.m>=G.plan.bubble+2&&G.m<G.plan.bubble+5)G.boughtBubbleTop++;if(G.m>=G.plan.crash&&G.m<=G.plan.crash+2)G.boughtDip=true;return true}
function sell(G,id,frac){const u=G.hold[id]||0;if(u<=0)return false;const su=u*frac,amt=su*G.px[id],f=Math.min(fee(amt),amt);G.cash+=amt-f;G.fees+=f;G.trades++;
  G.cost[id]=(G.cost[id]||0)*(1-frac);G.hold[id]=u-su;if(G.hold[id]<1e-9){delete G.hold[id];delete G.cost[id]}
  if(G.m>=G.plan.crash&&G.m<=G.plan.crash+2)G.soldInCrash+=amt;return true}

      {l:"Přikoupím ETF za polovinu hotovosti",xp:50,run:()=>{const a=buyB("ETF",B.cash/2);if(a)giveBadge("dip");return a?"Koupil(a) jsi ETF za "+kc(a)+" ve slevě.":"Na nákup nemáš dost hotovosti."},e:"Odvážné a historicky často výhodné. Riziko: trh může ještě chvíli padat. Proto je dobré mít rezervu."}]);
  }
  function bull(){
    shock({ETF:.1,PIX:.15,NEB:.25});log("Býk: trh roste, všichni jsou nadšení.");save();
    choose("Býk · trh roste",'Všichni jsou nadšení',"ETF +10 %, Pixelfarm +15 %, Nebula +25 %. V televizi mluví o burze, sousedi kupují akcie. Co uděláš?",[
      {l:"Koupím víc Nebuly za 10 000 Kč, letí to",xp:10,run:()=>{const a=buyB("NEB",10000);return a?"Koupil(a) jsi za "+kc(a)+".":"Nemáš dost hotovosti."},e:"Když jsou všichni nadšení, ceny bývají nejvyšší. Kupovat kvůli euforii je riskantní."},
      {l:"Nic, držím svůj plán",xp:40,run:()=>"",e:"Plán funguje v dobrých i špatných časech. Euforie ani strach by neměly řídit rozhodnutí."},
      {l:"Prodám vše a počkám, až to spadne",xp:15,run:()=>{let s=0;for(const k of Object.keys(BA))s+=sellB(k);return s?"Prodal(a) jsi za "+kc(s)+".":""},e:"Trefit vrchol i dno se skoro nikomu nedaří. Trh může růst ještě dlouho a ty budeš stát mimo."}]);
  }
  function finish(){
    busy=false;const v=bVal(B),inv=50000+BDEP*BQN;
    const held=Object.keys(BA).filter(k=>B.h[k]>=1000).length;
    const stars=[v>B.fs,held>=2||B.h.ETF>=v*.3,B.sold===0];const n=stars.filter(Boolean).length;
    if(!B.xpDone){B.xpDone=true;giveBadge("bfin");if(v>B.fs)giveBadge("bsave");if(v>B.fe)giveBadge("bindex");if(B.crash>0&&B.sold===0)giveBadge("iron");gainXP(50+n*50,"Konec deskové hry: "+"★".repeat(n)+"☆".repeat(3-n));
      const best=store.get("boardBest",0);if(v>best)store.set("boardBest",Math.round(v))}
    B.seenEnd=true;save();
    const L=[];
    L.push(v>B.fs?["ok","Porazil(a) jsi Spořílka o "+kc(v-B.fs)+". Investované peníze dlouhodobě obvykle rostou rychleji než spořicí účet."]:["warn","Spořílek tě porazil o "+kc(B.fs-v)+". Někdy se to stane, třeba po krachu nebo pastích. Bezpečí spořicího účtu má ale svou cenu: roste pomalu."]);
    L.push(v>B.fe?["ok","Porazil(a) jsi i Indexovou, která dala všechno do ETF. To je výkon! Bylo to umem, nebo štěstím?"]:["","Indexová, která jen kupovala ETF a nic nedělala, má "+kc(B.fe)+". Nudná strategie je těžký soupeř."]);
    if(B.sold>0)L.push(["warn","V krachu jsi prodal(a) za "+kc(B.sold)+". Tím se ztráta zafixovala."]);
    else if(B.crash>0)L.push(["ok","Krach jsi ustál(a) bez paniky."]);
    if(B.h.NEB>v*.3)L.push(["warn","Víc než třetinu peněz máš v Nebule. Jedna firma v humbuku je velké riziko."]);
    L.push(["","Kvízy: "+B.ok+" správně z "+(B.ok+B.bad)+". Poplatky "+kc(B.fees)+" za "+B.trades+" obchodů."]);
    $app.replaceChildren(
      h("div",{class:"card"},h("span",{class:"tag"},"Konec 5. roku"),h("h2",{},v>B.fs?"Vyhrál(a) jsi nad Spořílkem!":"Spořílek tentokrát vyhrál"),
        h("div",{class:"big num"},kc(v)),h("p",{},"Vloženo celkem "+kc(inv)+"."),
        lineChart([{v:B.vals,c:"var(--navy)",w:3},{v:B.feH,c:"var(--coin)",dash:"6 4"},{v:B.fsH,c:"var(--muted)",dash:"2 4"}]),
        h("div",{class:"legend"},h("span",{},h("i",{style:"background:var(--navy)"}),"Ty"),h("span",{},h("i",{style:"background:var(--coin)"}),"Indexová "+kc(B.fe)),h("span",{},h("i",{style:"background:var(--muted)"}),"Spořílek "+kc(B.fs)))),
      h("div",{class:"card"},h("span",{class:"tag"},"Hodnocení"),h("div",{class:"stars","aria-label":n+" ze 3 hvězd"},"★".repeat(n),h("span",{},"☆".repeat(3-n))),
        h("ul",{class:"check"},h("li",{class:stars[0]?"ok":""},"Porazit Spořílka"),h("li",{class:stars[1]?"ok":""},"Rozložit peníze (aspoň 2 investice nebo 30 % v ETF)"),h("li",{class:stars[2]?"ok":""},"Neprodat v panice"))),
      h("div",{class:"card"},h("h3",{},"Co se ukázalo"),h("ul",{class:"lessons"},...L.map(([c,t])=>h("li",{class:c},t)))),
      rankChip(),
      h("div",{class:"card"},h("h3",{},"Co dál?"),h("p",{class:"small"},"Zvládl(a) jsi základy. V režimu Burza naostro obchoduješ s 8 firmami každý měsíc, čteš výsledky hospodaření a dividendy."),
        h("div",{class:"row"},h("button",{class:"btn coin",onclick:()=>{store.set("board",null);boardGame()}},"Hrát znovu"),h("button",{class:"btn line",onclick:()=>{location.hash=""}},"Burza naostro"))));
    window.scrollTo(0,0);
  }
  draw();
  if(B.done)finish();
  else if(B.q===0&&B.pos===0&&!B.die)sheet("Desková hra","Cesta investora",
    h("p",{},"Máš 50 000 Kč na spořicím účtu. Házíš kostkou a obcházíš desku. Každý roh je jedno čtvrtletí: přibude 3 000 Kč a ceny se pohnou. Za 20 čtvrtletí (5 let) hra končí."),
    h("ul",{class:"lessons"},h("li",{},"Na polích Obchod (⇄) nakupuješ ETF a akcie."),h("li",{},"Kvízy dávají peníze, pasti je berou."),h("li",{},"Medvěd přinese krach, Býk euforii. Rozhodneš se, co uděláš.")),
    h("p",{class:"explain"},"Soupeříš se dvěma kamarády: Spořílek nechává všechno na spořicím účtu, Indexová dala všechno do ETF a nic nedělá. Porazíš je?"),
    h("button",{class:"btn coin",onclick:closeSheet},"Jdeme na to"));
}
