<style>

/* rat race board */
.tile.feature{grid-column:1/-1;border-color:var(--coin);background:color-mix(in srgb,var(--coin) 10%,var(--surface))}
.board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,minmax(64px,auto));gap:4px;background:var(--navy);padding:4px;border-radius:18px}
.sq{background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px 2px;font-size:.66rem;font-weight:800;line-height:1.15;position:relative;min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.sq .si{font-family:var(--display);font-size:1.15rem;font-weight:700;line-height:1}
.sq.V{background:var(--coin);color:var(--coin-ink)} .sq.P .si{color:var(--mint)} .sq.L .si{color:var(--bad)} .sq.K .si{color:var(--navy)} .sq.U .si{color:var(--muted)}

.center{grid-column:2/5;grid-row:2/5;background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}

.free-num{font-family:var(--display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.die{font-family:var(--display);font-size:1.6rem;width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:700;flex:none}
.roll{display:flex;gap:8px;align-items:center}

.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .25s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
.deal{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){h1{font-size:1.8rem}.big{font-size:2rem}}

/* single-game board (6x6 ring) */
.board{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(58px,auto));gap:3px;padding:3px}
.center{grid-column:2/6;grid-row:2/6;gap:6px}
.sq{font-size:.62rem;padding:3px 1px}

.sq.N .si{color:var(--coin-ink)} .sq.N{background:color-mix(in srgb,var(--coin) 22%,var(--surface))}

<script>
const $app=document.getElementById("app");
const kc=n=>(n<0?"−":"")+Math.round(Math.abs(n)).toLocaleString("cs-CZ")+" Kč";
function h(tag,a={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(a)){if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==null&&v!==undefined&&v!==false)e.setAttribute(k,v===true?"":v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c);return e}
const store={get(k,d){try{const v=localStorage.getItem("fg-"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("fg-"+k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ============ ODMĚNY ============ */
const RANKS=[[0,"Začátečník"],[150,"Šetřílek"],[400,"Rozpočtář"],[800,"Investor"],[1500,"Finanční guru"]];
const BADGES={
  start:["První krok","Získej první mince"],free:["Svoboda","Unikni z krysího závodu"],fast:["Raketa","Útěk do 18 měsíců"],
  nodebt:["Bez dluhu","Unikni a nikdy si nepůjč"],reserve:["Rezervista","Měj hotovost na 3 měsíce výdajů"],
  eye:["Oko pokladní","5 chytrých nákupů v jedné hře"],oracle:["Věštec","3 správné úrokové hádanky v jedné hře"],
  scam:["Detektiv","Odhal investiční podvod"],quiz10:["Série deset","10 správných odpovědí za sebou"],k1:["Tisícovka","Celkem 1 000 vydělaných mincí"]};
const rankOf=e=>{let r=0;RANKS.forEach((x,k)=>{if(e>=x[0])r=k});return r};
let rewardTimer;
function award(n,reason,badges=[],silent=false){
  const before=store.get("earned",0);const earned=before+n;
  store.set("coins",store.get("coins",0)+n);store.set("earned",earned);
  const have=new Set(store.get("badges",[]));const fresh=[];
  for(const b of [n>0?"start":null,...badges,earned>=1000?"k1":null])if(b&&BADGES[b]&&!have.has(b)){have.add(b);fresh.push(b)}
  store.set("badges",[...have]);
  const up=rankOf(earned)>rankOf(before);
  if(silent&&!fresh.length&&!up)return n;
  document.querySelectorAll(".reward").forEach(x=>x.remove());
  const el=h("div",{class:"reward",role:"status"},h("div",{class:"coin-dot","aria-hidden":"true"}),
    h("div",{},n?"+"+n+" mincí · "+reason:"",
      ...fresh.map(b=>h("div",{style:"font-weight:"+(n?400:800)},"Nový odznak: "+BADGES[b][0])),
      up?h("div",{style:"font-weight:400"},"Nová hodnost: "+RANKS[rankOf(earned)][1]):null));
  document.body.append(el);clearTimeout(rewardTimer);rewardTimer=setTimeout(()=>el.remove(),4200);
  return n;
}
const earnedPill=n=>h("div",{class:"earned"},"+"+n+" mincí");

/* ============ DATA ============ */
const QUIZ=[
  {"d": 1, "q": "V inzerátu je mzda 40 000 Kč hrubého. Kolik ti přijde na účet?", "o": ["Méně, strhne se pojištění a daň", "Přesně 40 000 Kč, hrubá mzda je to, co dostanu", "Asi 38 000 Kč, strhne se jen daň"], "a": 0, "e": "Hrubá mzda není čistá. Zaměstnavatel z ní strhne sociální a zdravotní pojištění a daň z příjmu. Ze 40 000 Kč hrubého ti přijde zhruba 32 tisíc. Pojištění se platí vždycky, nejen daň."},
  {"d": 2, "q": "Půjčka 10 000 Kč, splácíš 12× po 1 000 Kč. Kolik přeplatíš?", "o": ["2 000 Kč", "Nic, splátky jen rozloží půjčku na menší části", "1 000 Kč"], "a": 0, "e": "12 × 1 000 = 12 000 Kč, tedy o 2 000 Kč víc, než sis půjčil(a). RPSN takové půjčky vychází přes 40 % ročně. Při srovnání půjček koukej vždy na RPSN a celkovou splatnou částku."},
  {"d": 1, "q": "Přijde SMS: „Vaše banka: účet bude zablokován, ověřte se na odkazu.“ Co uděláš?", "o": ["Nekliknu a zavolám bance sám", "Kliknu, ale údaje nezadám, jen se podívám, co tam je", "Odpovím na SMS a zeptám se, jestli je pravá"], "a": 0, "e": "Typický phishing. Už odkaz může vést na stránku, která vypadá přesně jako banka, a odpověď podvodníkovi potvrdí, že číslo je aktivní. Banka po tobě přihlašovací údaje přes odkaz v SMS nikdy nechce."},

function makeRound(){
  const p=PRODUCTS[Math.floor(Math.random()*PRODUCTS.length)];const [a,b]=shuffle(p.sizes).slice(0,2);
  // big packs are not always cheaper per unit: randomize which side wins
  const ua=p.base*(0.8+Math.random()*0.5);let ub=ua*(Math.random()<.5?0.78+Math.random()*0.15:1.07+Math.random()*0.18);
  const price=(s,u)=>Math.max(5,Math.round(s*u)-(Math.random()<.6?0.1:0));
  const packs=[{s:a,price:price(a[0],ua)},{s:b,price:price(b[0],ub)}].map(x=>({...x,unit:x.price/x.s[0]}));
  return {p,packs};
}

      if(e.flood){const cost=S.insured?1000:25000;S.cash-=cost;cover();extra=h("p",{class:"explain"},S.insured?"Máš pojištění odpovědnosti. Pojišťovna zaplatí škodu, ty jen spoluúčast 1 000 Kč.":"Bez pojištění platíš celou škodu sám (sama). Pojištění odpovědnosti by stálo 160 Kč měsíčně.")}
      if(e.c){S.cash+=e.c;cover()}if(e.rent){S.exp.find(x=>x.id==="najem").amt+=e.rent}if(e.sal)S.salary+=e.sal;
      if(e.c>0)mood(4);if(e.c<0||e.flood)mood(-3);
      log("Událost: "+e.n+".");
      if(!extra&&S.exp.some(x=>x.n==="Splátka půjčky")&&e.c<0)extra=h("p",{class:"small"},"Bez rezervy tě nečekané výdaje ženou do dluhů. Proto se vyplatí mít hotovost stranou.");
      return result("Nečekaná událost",e.n+". "+e.d,extra)}
    if(t==="L"){const m=TEMPTS[Math.floor(Math.random()*TEMPTS.length)];
      const stake=m.perm?"+"+kc(m.perm)+" k výdajům každý měsíc":kc(m.full);
      return ask("Lákadlo",[h("h2",{},m.n),h("p",{},m.d),h("p",{class:"explain"},"Odpověz správně a odoláš"+(m.cheap?" (zaplatíš jen levnější variantu "+kc(m.cheap)+")":"")+". Špatně: "+stake+".")],ok=>{
        closeSheet();
        if(ok){if(m.cheap){S.cash-=m.cheap;cover();mood(4)}else mood(-2);log("Lákadlo "+m.n+": odolal(a) jsi.")}
        else{mood(6);if(m.perm){S.exp.push({n:m.pn,amt:m.perm,debt:m.debt,id:"t"+Date.now()});if(m.debt)S.everDebt=true}else{S.cash-=m.full;cover()}log("Lákadlo "+m.n+": "+stake+".")}
        done()})}
    if(t==="P")return opportunity();
  }
  function shop(){
    const cur=makeRound();const best=cur.packs[0].unit<cur.packs[1].unit?0:1;S.buys++;const fb=h("div",{style:"display:flex;flex-direction:column;gap:10px"});
    const btns=cur.packs.map((pk,k)=>h("button",{class:"pack",onclick:()=>{
      btns.forEach((x,j)=>{x.disabled=true;x.querySelector(".unit").textContent=kc2(cur.packs[j].unit)+" / "+cur.p.u;if(j===best)x.classList.add("right");else if(j===k)x.classList.add("wrong")});
      const ok=k===best;answered(ok);
      if(ok){S.buysOk++;S.cash+=800;log("Nákup: chytrá volba, ušetřeno 800 Kč.");if(S.buysOk>=5)award(0,"",["eye"],true)}else{S.cash-=400;cover();log("Nákup: dražší balení, −400 Kč.")}
      const diff=Math.abs(cur.packs[0].unit-cur.packs[1].unit)/Math.max(cur.packs[0].unit,cur.packs[1].unit)*100;
      fb.replaceChildren(h("p",{class:"explain"},h("b",{},ok?"Správně, ušetřeno 800 Kč. ":"Vedle, za měsíc to dělá 400 Kč navíc. "),(best===0?"Levá":"Pravá")+" nabídka je za "+cur.p.u+" levnější o "+Math.round(diff)+" %."+(cur.packs[best].s[0]<cur.packs[1-best].s[0]?" Tentokrát vyhrálo menší balení!":"")+" Na cenovce malým písmem bývá cena za 1 kg nebo 1 l."),
        h("button",{class:"btn",onclick:()=>{closeSheet();done()}},"Pokračovat"));
    }},h("div",{class:"box","aria-hidden":"true"},pk.s[1]),h("div",{class:"size"},pk.s[1]),h("div",{class:"price"},kc2(pk.price)),h("div",{class:"unit"})));
    openSheet(h("span",{class:"tag"},"Nákup"),h("h2",{},cur.p.n),h("p",{},"Které balení je levnější za "+cur.p.u+"? Chytrý nákup ušetří 800 Kč, dražší stojí 400 Kč."),h("div",{class:"packs"},...btns),fb);
  }
  function budget(){
    const b=BUDGET[Math.floor(Math.random()*BUDGET.length)];
    const label=o=>o.line?(o.line[2]?kc(o.line[2])+" / měsíc":"0 Kč / měsíc"):o.debtLine?kc(o.debtLine[1])+" / měsíc":o.c?"− "+kc(o.c):"0 Kč";
    openSheet(h("span",{class:"tag"},"Rozpočet"),h("h2",{},b.n),h("p",{},b.d),
      h("div",{class:"choices"},...b.o.map(o=>h("button",{class:"choice",onclick:()=>{
        if(o.c){S.cash-=o.c;cover()}
        if(o.line)setLine(...o.line);
        if(o.debtLine){S.exp.push({n:o.debtLine[0],amt:o.debtLine[1],debt:o.debtLine[2],id:"d"+Date.now()});S.everDebt=true}
        if(o.ins)S.insured=true;mood(o.mood||0);log("Rozpočet, "+b.n+": "+o.l+".");
        openSheet(h("span",{class:"tag"},"Rozpočet"),h("h2",{},o.l),h("p",{},"Nálada "+(o.mood>0?"+":"")+(o.mood||0)+" %, teď "+S.mood+" %."+(o.line||o.debtLine?" Měsíční výdaje jsou teď "+kc(expenses())+".":"")),
          h("p",{class:"explain"},b.e),h("button",{class:"btn",onclick:()=>{closeSheet();done()}},"Pokračovat"));
      }},h("span",{},o.l),h("span",{class:"cost"},label(o))))));
  }
  function bank(){
    const pm=[1000,2000,3000,5000][rint(0,3)],yrs=[10,20,30][rint(0,2)],fund=Math.random()<.6,r=fund?.07:.03;
    const val=fv(pm,r,yrs),paid=pm*12*yrs,rnd=x=>Math.round(x/1000)*1000;
    const opts=shuffle([[rnd(paid),false],[rnd(val),true],[rnd(val*1.9),false]]);const correct=opts.findIndex(x=>x[1]);
    choiceSheet("Úrok",[h("p",{},"Správná odpověď = bonus 2 000 Kč.")],
      "Spoříš "+kc(pm)+" měsíčně "+(fund?"do akciového fondu s průměrným výnosem 7 % ročně":"na spořicí účet s úrokem 3 % ročně")+". Kolik budeš mít za "+yrs+" let?",
      opts.map(x=>kc(x[0])),correct,
      "Vložíš "+kc(paid)+" a úroky přidají "+kc(val-paid)+". Celkem "+kc(val)+"."+(fund?" Pozor, 7 % je dlouhodobý průměr, akcie v některých letech i hodně klesají.":" Spořicí účet je bezpečný, ale roste pomaleji.")+(yrs>=20?" Čím déle peníze necháš růst, tím víc pracuje úrok z úroku.":""),
      ok=>{if(ok){S.cash+=2000;S.bankOk++;log("Úrok: správně, +2 000 Kč.");if(S.bankOk>=3)award(0,"",["oracle"],true)}else log("Úrok: bez bonusu.");closeSheet();done()});
  }
  function opportunity(){
    ask("Investice",[h("p",{},"Než do něčeho vložíš peníze, musíš tomu rozumět. Odpověz správně a uvidíš nabídku.")],ok=>{
      if(!ok){closeSheet();log("Příležitost ti utekla.");return result("Investice","Než jsi pochopil(a), o co jde, obchod koupil někdo jiný.")}
      if(Math.random()<.22){const sc=SCAMS[Math.floor(Math.random()*SCAMS.length)];const cost=Math.min(sc.cost,Math.max(S.cash,1000));
        openSheet(h("span",{class:"tag"},"Nabídka"),h("div",{class:"deal"},h("h3",{},sc.n),h("p",{},sc.d),h("div",{class:"nums"},h("span",{},"Vklad ",h("b",{},kc(cost))))),
          h("div",{class:"row"},
            h("button",{class:"btn coin",disabled:S.cash<cost||null,onclick:()=>{S.cash-=cost;log("Podvod "+sc.n+": −"+kc(cost)+".");closeSheet();result("Byl to podvod","Peníze jsou pryč. "+sc.why)}},"Investovat"),
            h("button",{class:"btn line",onclick:()=>{S.coins+=5;S.scams++;award(5,"Odhalený podvod",["scam"],true);log("Odhalen podvod: "+sc.n+".");closeSheet();result("Dobrý instinkt","Byl to podvod. "+sc.why+" Bonus 5 mincí.")}},"Nechci")));
        return}
      const aff=DEALS.filter(x=>x.cost<=S.cash);const pick=aff.length?aff[Math.max(0,aff.length-1-Math.floor(Math.random()*2))]:DEALS[Math.floor(Math.random()*3)];
      const can=S.cash>=pick.cost;
      openSheet(h("span",{class:"tag"},"Nabídka"),h("div",{class:"deal"},h("h3",{},pick.n),h("p",{},pick.d),
          h("div",{class:"nums"},h("span",{},"Cena ",h("b",{},kc(pick.cost))),h("span",{},"Příjem ",h("b",{style:"color:var(--mint)"},"+"+kc(pick.inc)+" měsíčně")),h("span",{},"Návratnost ",h("b",{},Math.round(pick.cost/pick.inc)+" měsíců")))),
        can?null:h("p",{class:"explain"},"Na tohle zatím nemáš. Šetři hotovost na další příležitost."),
        h("div",{class:"row"},
          h("button",{class:"btn coin",disabled:!can||null,onclick:()=>{S.cash-=pick.cost;S.assets.push({n:pick.n,inc:pick.inc});mood(5);log("Koupeno: "+pick.n+" (+"+kc(pick.inc)+" měsíčně).");closeSheet();done()}},"Koupit"),
          h("button",{class:"btn line",onclick:()=>{closeSheet();log("Nabídku jsi nechal(a) být.");done()}},can?"Nechat být":"Zavřít")));
    });
  }
  function checkWin(){
    if(passive()<expenses())return false;
    S.won=true;save();
    const m=S.months;const prev=store.get("zavod1",null);const rec=prev===null||m<prev;if(rec)store.set("zavod1",m);
    const got=award(100,"Útěk z krysího závodu",["free",m<=18?"fast":null,!S.everDebt?"nodebt":null]);
    const L=[["ok","Aktiva, která vlastníš: "+S.assets.map(a=>a.n).join(", ")+"."],
      [S.exp.some(x=>x.debt)?"warn":"ok",S.exp.some(x=>x.debt)?"Pořád máš dluhy. Jejich splacení by ti snížilo výdaje a útěk zrychlilo.":"Žádné dluhy. Splacené závazky snížily výdaje, které musel pasivní příjem pokrýt."],
      ["","Otázky: správně "+S.ok+" z "+(S.ok+S.bad)+". Chytré nákupy "+S.buysOk+" z "+S.buys+". Úrokové hádanky "+S.bankOk+"."+(S.scams?" Odhalené podvody: "+S.scams+".":"")],
      S.burn?["warn","Vyhořel(a) jsi "+S.burn+"×. Rozpočet bez radosti dlouho nevydrží."]:["ok","Ani jednou jsi nevyhořel(a). Držel(a) jsi rovnováhu mezi šetřením a radostí."],
      ["","Ve skutečném životě to trvá roky, ne měsíce. Ale začít se dá klidně už s první brigádou."]];
    $app.replaceChildren(bar([stat("Měsíců",String(m)),stat("Správně",S.ok+" / "+(S.ok+S.bad),"good")]),
      h("div",{class:"card"},h("span",{class:"tag"},"Svoboda"),h("h2",{},"Unikl(a) jsi z krysího závodu!"),
        h("p",{},"Tvůj pasivní příjem "+kc(passive())+" pokrývá všechny výdaje "+kc(expenses())+". Práce je teď volba, ne nutnost."),
        h("div",{class:"big"},m+" měsíců"),earnedPill(got+S.coins),rec?h("p",{class:"best"},"Nový osobní rekord!"):null,
        h("ul",{class:"lessons"},...L.map(([c,t])=>h("li",{class:c},t))),
        h("div",{class:"row"},h("button",{class:"btn coin",onclick:()=>{S=newRace();save();gameRace()}},"Hrát znovu"),h("button",{class:"btn line",onclick:()=>go("")},"Domů"))));
    window.scrollTo(0,0);return true;
  }
  draw();
}
