<title>Peněženka v kostce</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap">
<style>
/* Layout: arcade-style hub of four game tiles; each game opens as its own full view with a sticky score bar */
:root{
  --bg:#f2f4fb; --surface:#ffffff; --ink:#18203a; --muted:#5b6583; --line:#dde2f0;

  --display:"Fredoka","Trebuchet MS",sans-serif;
  --body:"Nunito Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1222; --surface:#171d34; --ink:#eef0fa; --muted:#a3abc8; --line:#2a3254;
  --navy:#9fb0ff; --coin:#f6c454; --coin-ink:#2b1e00; --mint:#47d1a3; --bad:#ff7b70; --soft:#1f2747; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1222; --surface:#171d34; --ink:#eef0fa; --muted:#a3abc8; --line:#2a3254;
  --navy:#9fb0ff; --coin:#f6c454; --coin-ink:#2b1e00; --mint:#47d1a3; --bad:#ff7b70; --soft:#1f2747; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:2.2rem;color:var(--navy)} h2{font-size:1.7rem;color:var(--navy)} h3{font-size:1.2rem}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.btn{background:var(--navy);color:var(--bg);border:none;border-radius:14px;min-height:52px;padding:0 22px;font-weight:800}
.btn.coin{background:var(--coin);color:var(--coin-ink)}
.btn.line{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn:disabled{opacity:.45;cursor:default}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.coinlogo{width:64px;height:64px;border-radius:50%;background:var(--coin);color:var(--coin-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.6rem;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);flex:none}
.hero > div{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--navy);transform:translateY(-2px)}
.tile .ico{font-family:var(--display);font-size:1.6rem;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--navy);font-weight:700}

.best{margin-top:auto;font-size:.85rem;font-weight:800;color:var(--mint)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{background:transparent;border:2px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;font-weight:800}
.stat{display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 12px;min-width:92px}
.stat b{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.stat.good b{color:var(--mint)} .stat.bad b{color:var(--bad)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.choices{display:flex;flex-direction:column;gap:10px}

.choice .cost{font-family:var(--display);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.choice.right{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 14%,var(--surface))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.choice:disabled{cursor:default}
.explain{border-left:4px solid var(--coin);padding:6px 0 6px 14px;color:var(--ink)}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--coin);transition:width .3s}
.tag{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.lessons{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.lessons li{background:var(--soft);border-radius:12px;padding:10px 14px}
.lessons li.ok{border-left:5px solid var(--mint)} .lessons li.warn{border-left:5px solid var(--bad)}
.big{font-family:var(--display);font-size:2.4rem;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
/* interest race */
.ctrl{display:flex;flex-direction:column;gap:4px}
.ctrl label{font-weight:800;display:flex;justify-content:space-between;gap:8px}
.ctrl output{font-family:var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--navy);min-height:36px}
.lanes{display:flex;flex-direction:column;gap:14px}

.track{height:30px;background:var(--soft);border-radius:10px;overflow:hidden;position:relative}

/* unit price */
.packs{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.box{width:62px;height:76px;border-radius:10px;background:var(--navy);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;padding:4px;line-height:1.1}
.foot{color:var(--muted);font-size:.85rem;max-width:65ch}
/* wallet & rewards */
.wallet{background:var(--navy);color:var(--bg);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.wallet-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.coins{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.coin-dot{width:30px;height:30px;border-radius:50%;background:var(--coin);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none}
.rank{font-weight:800;text-align:right}
.rank small{display:block;font-weight:400;opacity:.8}
.wallet .progress{background:color-mix(in srgb,var(--bg) 25%,transparent)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--muted)}
.badge b{font-family:var(--display);font-size:1rem;color:var(--ink);font-weight:600}
.badge.on{border-color:var(--coin);background:color-mix(in srgb,var(--coin) 14%,var(--surface))}
.badge.off b{color:var(--muted)}
.goal input{font:inherit;min-height:48px;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.goal label{display:flex;flex-direction:column;gap:4px;font-weight:800;flex:1;min-width:180px}
.reward{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:20;background:var(--coin);color:var(--coin-ink);border-radius:18px;padding:14px 20px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.reward .coin-dot{background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.reward{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:translate(-50%,20px) scale(.9);opacity:0}}}
.earned{font-family:var(--display);font-weight:700;color:var(--coin-ink);background:var(--coin);border-radius:99px;padding:4px 14px;align-self:flex-start;font-variant-numeric:tabular-nums}
/* rat race board */
.tile.feature{grid-column:1/-1;border-color:var(--coin);background:color-mix(in srgb,var(--coin) 10%,var(--surface))}
.board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,minmax(64px,auto));gap:4px;background:var(--navy);padding:4px;border-radius:18px}
.sq{background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px 2px;font-size:.66rem;font-weight:800;line-height:1.15;position:relative;min-width:0;overflow-wrap:anywhere;color:var(--muted)}
.sq .si{font-family:var(--display);font-size:1.15rem;font-weight:700;line-height:1}
.sq.V{background:var(--coin);color:var(--coin-ink)} .sq.P .si{color:var(--mint)} .sq.L .si{color:var(--bad)} .sq.K .si{color:var(--navy)} .sq.U .si{color:var(--muted)}
.sq.here{outline:3px solid var(--ink);outline-offset:-3px}
.token{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--bad);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.center{grid-column:2/5;grid-row:2/5;background:var(--surface);border-radius:12px;padding:10px;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.center .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.free-num{font-family:var(--display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.die{font-family:var(--display);font-size:1.6rem;width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-weight:700;flex:none}
.roll{display:flex;gap:8px;align-items:center}
.roll .btn{flex:1;min-height:46px;padding:0 10px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .25s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}}
.deal{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.deal .nums{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.deal .nums b{font-family:var(--display)}
.stmt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.stmt{grid-template-columns:1fr}}
.stmt table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.stmt td{padding:5px 0;border-bottom:1px solid var(--line)} .stmt td:last-child{text-align:right;font-weight:800}
.stmt .tot td{border-bottom:none;padding-top:8px}
.mini{background:transparent;border:2px solid var(--mint);color:var(--mint);border-radius:8px;font-weight:800;font-size:.75rem;padding:2px 8px;margin-left:6px}
.log{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){h1{font-size:1.8rem}.big{font-size:2rem}}
</style>

<script>
const $app=document.getElementById("app");
const kc=n=>(n<0?"−":"")+Math.round(Math.abs(n)).toLocaleString("cs-CZ")+" Kč";
function h(tag,a={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(a)){if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==null&&v!==undefined&&v!==false)e.setAttribute(k,v===true?"":v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c);return e}
const store={get(k,d){try{const v=localStorage.getItem("fg-"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("fg-"+k,JSON.stringify(v))}catch(e){}}};
function saveBest(k,v){const b=store.get(k,null);if(b===null||v>b){store.set(k,v);return true}return false}
/* ---- rewards ---- */
const RANKS=[[0,"Začátečník"],[150,"Šetřílek"],[400,"Rozpočtář"],[800,"Investor"],[1500,"Finanční guru"]];
const BADGES={
  start:["První krok","Dohraj libovolnou hru"],quiz10:["Neoklameš mě","10 z 10 v kvízu"],
  reserve:["Rezervista","Měsíc s rezervou i pojištěním"],nodebt:["Bez dluhu","Měsíc v plusu a bez splátek"],
  eye:["Oko pokladní","120+ bodů v lovu cen"],streak5:["Série pět","5 správných cen za sebou"],
  oracle:["Věštec","Milionová hádanka do 5 %"],free:["Svoboda","Unikni z krysího závodu"],fast:["Raketa","Útěk ze závodu do 15 měsíců"],k1:["Tisícovka","Celkem 1 000 vydělaných mincí"]};
const rankOf=e=>{let r=0;RANKS.forEach((x,k)=>{if(e>=x[0])r=k});return r};
let rewardTimer;
function award(n,reason,badges=[],silent=false){
  const before=store.get("earned",0);const earned=before+n;
  store.set("coins",store.get("coins",0)+n);store.set("earned",earned);
  const have=new Set(store.get("badges",[]));const fresh=[];
  for(const b of ["start",...badges,earned>=1000?"k1":null])if(b&&!have.has(b)){have.add(b);fresh.push(b)}
  store.set("badges",[...have]);
  const up=rankOf(earned)>rankOf(before);
  if(silent&&!fresh.length&&!up)return n;
  document.querySelectorAll(".reward").forEach(x=>x.remove());
  const el=h("div",{class:"reward",role:"status"},h("div",{class:"coin-dot","aria-hidden":"true"}),
    h("div",{},"+"+n+" mincí · "+reason,
      ...fresh.map(b=>h("div",{style:"font-weight:400"},"Nový odznak: "+BADGES[b][0])),
      up?h("div",{style:"font-weight:400"},"Nová hodnost: "+RANKS[rankOf(earned)][1]):null));
  document.body.append(el);clearTimeout(rewardTimer);rewardTimer=setTimeout(()=>el.remove(),4200);
  return n;
}
const earnedPill=n=>h("div",{class:"earned"},"+"+n+" mincí");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ============ ROUTING ============ */
const GAMES={
  zavod:{feature:true,ico:"⚄",name:"Krysí závod",desc:"Deskovka o tom, jak přestat jen pracovat od výplaty k výplatě. Správné odpovědi ti otevírají investice, které vydělávají za tebe. Unikneš, až pasivní příjem pokryje všechny výdaje.",best:()=>store.get("zavod",null),bestFmt:v=>"Nejrychlejší útěk: "+(-v)+" měsíců",run:()=>gameRace()},
  mesic:{ico:"Kč",name:"Přežij měsíc",desc:"Máš výplatu a měsíc plný lákadel a nehod. Vydržíš do další výplaty a nebudeš otráveně sedět doma?",best:()=>store.get("mesic",null),bestFmt:v=>"Nejlepší skóre: "+v,run:()=>gameMonth()},
  urok:{ico:"%",name:"Úrokový závod",desc:"Polštář, spořicí účet, nebo fond? Nastav si spoření a sleduj, kdo za 20 let vyhraje. Plus hádanka na milion.",best:()=>store.get("urok",null),bestFmt:v=>"Nejpřesnější tip: odchylka "+v+" %",run:()=>gameInterest()},
  kviz:{ico:"?",name:"Past, nebo výhoda?",desc:"Brigáda, in-game nákupy, podvody na sítích, půjčky a slevy. Každé kolo 10 situací z 20, poznáš, kde je háček?",best:()=>store.get("kviz",null),bestFmt:v=>"Nejlepší: "+v+" / 10",run:()=>gameQuiz()},
  cena:{ico:"⚖",name:"Lovec jednotkové ceny",desc:"Velké balení nebo malé? Rychle vyber, co je opravdu levnější za kilo nebo litr.",best:()=>store.get("cena",null),bestFmt:v=>"Nejlepší: "+v+" bodů",run:()=>gameUnit()},
};
function route(){const k=location.hash.slice(1);window.scrollTo(0,0);if(GAMES[k])GAMES[k].run();else hub()}
window.addEventListener("hashchange",route);
function go(k){if(location.hash.slice(1)===k)route();else location.hash=k}

function walletPanel(){
  const coins=store.get("coins",0),earned=store.get("earned",0),r=rankOf(earned);
  const next=RANKS[r+1];const pct=next?Math.min(100,(earned-RANKS[r][0])/(next[0]-RANKS[r][0])*100):100;
  return h("div",{class:"wallet"},
    h("div",{class:"wallet-top"},h("div",{class:"coins"},h("div",{class:"coin-dot","aria-hidden":"true"}),coins.toLocaleString("cs-CZ")+" mincí"),
      h("div",{class:"rank"},RANKS[r][1],h("small",{},next?"Do hodnosti "+next[1]+": "+(next[0]-earned)+" mincí":"Nejvyšší hodnost"))),
    h("div",{class:"progress"},h("i",{style:"width:"+pct+"%"})));
}
function badgesPanel(){
  const have=new Set(store.get("badges",[]));
  return h("div",{class:"card"},h("h3",{},"Odznaky "+have.size+" / "+Object.keys(BADGES).length),
    h("div",{class:"badges"},...Object.entries(BADGES).map(([k,[n,d]])=>h("div",{class:"badge "+(have.has(k)?"on":"off")},h("b",{},(have.has(k)?"★ ":"☆ ")+n),d))));
}
function goalPanel(){
  const g=store.get("goal",null),coins=store.get("coins",0);const box=h("div",{class:"card goal"});
  if(!g){
    const t=h("input",{type:"text",id:"goal-text",placeholder:"např. 200 Kč na kino"});
    const n=h("input",{type:"number",id:"goal-n",min:50,step:50,value:500,inputmode:"numeric"});
    box.append(h("span",{class:"tag"},"Volitelná odměna"),h("h3",{},"Skutečná odměna za mince"),
      h("p",{class:"small"},"Motivace navíc: domluvte se s rodičem, kamarádem nebo sami se sebou, co dostanete, když nasbíráte daný počet mincí. Mince jdou získat jen hraním a správnými odpověďmi."),
      h("div",{class:"row"},h("label",{for:"goal-text"},"Odměna",t),h("label",{for:"goal-n"},"Počet mincí",n)),
      h("button",{class:"btn coin",onclick:()=>{const text=t.value.trim();const target=Math.max(10,Math.round(+n.value||0));if(!text){t.focus();return}store.set("goal",{text,target});hub()}},"Nastavit odměnu"));
    return box;
  }
  const done=coins>=g.target;

/* ============ 1. PŘEŽIJ MĚSÍC ============ */
function gameMonth(){
  const INCOME=30000;

  const intro={t:"Výplata přišla",d:"Je ti 20, bydlíš poprvé sám (sama) a máš první stálou práci. Čistá mzda 30 000 Kč. Nájem a energie (13 000 Kč) odešly trvalým příkazem. Zbývá 17 000 Kč. Kolik hned pošleš na spořicí účet jako rezervu?",
    o:[{l:"Nic, utratím to podle potřeby",c:0,hp:4},{l:"2 000 Kč do rezervy",reserve:2000,hp:0,f:"res"},{l:"4 000 Kč do rezervy",reserve:4000,hp:-2,f:"res"}]};
  const pool=[
    {t:"Jídlo na celý měsíc",d:"Jak budeš jíst?",o:[{l:"Vařím doma, nosím krabičky",c:4500,hp:-2},{l:"Napůl doma, napůl venku",c:6500,hp:4},{l:"Hlavně rozvoz a restaurace",c:10500,hp:10,f:"food"}]},
    {t:"Koncert s partou",d:"Kamarádi jdou v sobotu na koncert.",o:[{l:"Jdu, lístek na stání",c:1400,hp:10},{l:"Jdu jen na afterparty",c:400,hp:5},{l:"Nejdu",c:0,hp:-7}]},
    {t:"Prasklý displej",d:"Telefon spadl na dlažbu. Co teď?",o:[{l:"Oprava displeje",c:2500,hp:0},{l:"Nový telefon na 24 splátek po 900 Kč",c:900,hp:9,f:"splatky",debt:20700},{l:"Používám ho prasklý",c:0,hp:-6}]},
    {t:"Black Friday",d:"Sluchátka, na která koukáš půl roku, jsou o 30 % levnější: 3 200 Kč.",o:[{l:"Beru",c:3200,hp:7},{l:"Ne, teď na ně nemám",c:0,hp:-1}]},
    {t:"Předplatné",d:"Na filmy a hudbu máš tři služby.",o:[{l:"Nechám všechny tři",c:870,hp:3},{l:"Nechám jednu",c:290,hp:1},{l:"Zruším všechny",c:0,hp:-3}]},
    {t:"Narozeniny mámy",d:"Za týden má máma narozeniny.",o:[{l:"Kytka a parfém",c:1600,hp:5},{l:"Upeču dort a přijedu",c:250,hp:6},{l:"Pošlu SMS",c:0,hp:-8}]},
    {t:"Doprava do práce",d:"Jak budeš tento měsíc jezdit?",o:[{l:"Měsíční jízdenka MHD",c:550,hp:0},{l:"Většinou taxi",c:3800,hp:6,f:"taxi"},{l:"Na kole",c:0,hp:2}]},
    {t:"Výprodej oblečení",d:"„Kup 3 kusy a 3. máš zdarma“ v oblíbeném obchodě.",o:[{l:"Beru 3 kusy, i když potřebuju jeden",c:1800,hp:5,f:"sleva"},{l:"Koupím jen tu jednu bundu",c:900,hp:3},{l:"Nic nepotřebuju",c:0,hp:0}]},
  ];
  const insurance={t:"Nabídka pojištění",d:"Pojišťovna nabízí pojištění domácnosti a odpovědnosti za 160 Kč měsíčně.",o:[{l:"Sjednám",c:160,hp:0,ins:true},{l:"To nepotřebuju",c:0,hp:0}]};
  const steps=[intro,...shuffle(pool).slice(0,5),insurance,"pracka","soused"];
  let i=0;
  const head=h("div");const body=h("div",{style:"display:flex;flex-direction:column;gap:16px"});
  $app.replaceChildren(head,body);
  function drawBar(){head.replaceChildren(bar([stat("Na účtu",kc(S.money),S.money<0?"bad":""),stat("Rezerva",kc(S.reserve),S.reserve>0?"good":""),stat("Nálada",Math.max(0,Math.min(100,S.happy))+" %")]))}
  function next(){
    drawBar();
    if(i>=steps.length)return end();
    let st=steps[i];
    if(st==="pracka")return shock("Rozbila se pračka","Den před výplatou přestane pračka točit. Oprava stojí 6 000 Kč a bez ní to nejde.",6000,false);
    if(st==="soused")return shock("Voda u souseda","Hadice od myčky povolila a vytopil(a) jsi souseda pod sebou. Oprava stropu: 25 000 Kč.",25000,true);
    body.replaceChildren(h("div",{class:"progress"},h("i",{style:"width:"+(i/steps.length*100)+"%"})),
      h("div",{class:"card"},h("span",{class:"tag"},"Krok "+(i+1)+" z "+steps.length),h("h2",{},st.t),h("p",{},st.d),
        h("div",{class:"choices"},...st.o.map(o=>h("button",{class:"choice",onclick:()=>{

          h("span",{},o.l),h("span",{class:"cost"},o.reserve?"→ "+kc(o.reserve):o.c?"− "+kc(o.c):"0 Kč"))))));
  }
  function shock(t,d,cost,ins){
    let pay=cost,note="";
    if(ins&&S.insured){pay=1000;note="Máš pojištění odpovědnosti. Pojišťovna zaplatí škodu, ty jen spoluúčast 1 000 Kč."}
    else if(ins){note="Bez pojištění platíš celou škodu sám (sama)."}
    const fromRes=Math.min(S.reserve,pay);const fromAcc=pay-fromRes;
    S.reserve-=fromRes;S.money-=fromAcc;S.flags[ins?"shock2":"shock1"]={fromRes,fromAcc,pay};
    if(S.money<0)S.happy-=10;
    body.replaceChildren(h("div",{class:"progress"},h("i",{style:"width:"+((i+1)/steps.length*100)+"%"})),
      h("div",{class:"card"},h("span",{class:"tag"},"Nečekaná událost"),h("h2",{},t),h("p",{},d),
        note?h("p",{class:"explain"},note):null,
        h("p",{},"Zaplaceno "+kc(pay)+(fromRes?": "+kc(fromRes)+" z rezervy":"")+(fromAcc?(fromRes?", ":": ")+kc(fromAcc)+" z účtu":"")+"."),
        S.money<0?h("p",{class:"explain"},"Účet je v minusu. Banka ti půjčí přes kontokorent, ale s úrokem kolem 20 % ročně."):null,
        h("button",{class:"btn",onclick:()=>{i++;next()}},"Pokračovat")));
    drawBar();
  }
  function end(){
    const hp=Math.max(0,Math.min(100,S.happy));
    const total=S.money+S.reserve-S.debt;
    const score=Math.max(0,Math.round((S.money+S.reserve)/100+hp*2-(S.debt>0?50:0)-(S.money<0?80:0)));
    const rec=saveBest("mesic",score);
    const got=award(Math.max(5,Math.round(score/8)),"Přežij měsíc",[S.flags.res&&S.insured?"reserve":null,S.money>=0&&!S.debt?"nodebt":null]);
    const L=[];
    if(S.flags.res)L.push(["ok","Rezerva zabrala. Peníze odložené hned po výplatě tě podržely při nehodě. Obvykle se doporučuje mít v rezervě 3 až 6 měsíčních výdajů."]);
    else L.push(["warn","Bez rezervy musela nehoda jít z běžného účtu. Zkus si příště dát stranou hned po výplatě, i malá částka pomůže."]);
    if(S.insured)L.push(["ok","Pojištění odpovědnosti za 160 Kč tě ušetřilo 24 000 Kč. Malé pravidelné platby mohou chránit před velkými ranami."]);
    else L.push(["warn","Bez pojištění odpovědnosti jsi platil(a) celou škodu u souseda. Je to jedno z nejlevnějších a nejužitečnějších pojištění."]);
    if(S.flags.splatky)L.push(["warn","Telefon na splátky: 24 × 900 Kč = 21 600 Kč, ale v obchodě stojí kolem 16 000 Kč. Za splátky zaplatíš víc a ještě dva roky."]);
    if(S.flags.food)L.push(["warn","Rozvoz jídla byl tvůj největší výdaj. Jídlo bývá místo, kde se dá ušetřit nejvíc bez velké ztráty pohodlí."]);
    if(S.flags.sleva)L.push(["warn","Akce „3 za 2“ šetří, jen když tři kusy opravdu potřebuješ. Jinak jsi utratil(a) o 900 Kč víc."]);
    if(S.flags.taxi)L.push(["warn","Taxi stálo skoro 7× víc než měsíční jízdenka."]);
    if(hp<35)L.push(["warn","Ušetřil(a) jsi, ale nálada je na dně. Dobrý rozpočet počítá i s radostí, jen s rozmyslem."]);
    body.replaceChildren(h("div",{class:"card"},h("span",{class:"tag"},"Konec měsíce"),
      h("h2",{},S.money<0?"Do výplaty jsi nedotáhl(a) bez dluhu":total>8000?"Měsíc zvládnutý na jedničku":"Přežito"),
      h("div",{class:"big"},score+" bodů"),earnedPill(got),rec?h("p",{class:"best"},"Nový osobní rekord!"):null,
      h("p",{class:"small"},"Na účtu "+kc(S.money)+", v rezervě "+kc(S.reserve)+(S.debt?", dluh na splátkách "+kc(S.debt):"")+", nálada "+hp+" %."),
      h("ul",{class:"lessons"},...L.map(([c,t])=>h("li",{class:c},t))),
      h("div",{class:"row"},h("button",{class:"btn coin",onclick:()=>gameMonth()},"Hrát znovu"),h("button",{class:"btn line",onclick:()=>go("")},"Zpět na hry"))));
    window.scrollTo(0,0);
  }
  next();
}

function gameInterest(){
  const st={pm:2000,yrs:20,real:false};
  const LANES=[{n:"Doma pod polštářem",r:0,col:"var(--muted)"},{n:"Spořicí účet (3 % ročně)",r:.03,col:"var(--navy)"},{n:"Akciový fond (průměrně 7 % ročně)",r:.07,col:"var(--mint)"}];
  const INFL=.03;
  const fv=(p,r,y)=>{const n=y*12,i=r/12;return i===0?p*n:p*((Math.pow(1+i,n)-1)/i)};
  const pmI=h("input",{type:"range",id:"pm",min:500,max:10000,step:500,value:st.pm});
  const yrI=h("input",{type:"range",id:"yrs",min:1,max:40,step:1,value:st.yrs});
  const pmO=h("output",{for:"pm"});const yrO=h("output",{for:"yrs"});
  const realI=h("input",{type:"checkbox",id:"real"});

  function draw(){
    pmO.textContent=kc(st.pm);yrO.textContent=st.yrs+" "+(st.yrs===1?"rok":st.yrs<5?"roky":"let");
    const paid=st.pm*12*st.yrs;const defl=st.real?Math.pow(1+INFL,st.yrs):1;
    const vals=LANES.map(l=>fv(st.pm,l.r,st.yrs)/defl);const max=Math.max(...vals,paid);
    lanes.replaceChildren(...LANES.map((l,k)=>h("div",{},h("div",{class:"lane-head"},h("span",{},l.n),h("span",{},kc(vals[k]))),
      h("div",{class:"track"},h("div",{class:"fill",style:"width:"+(vals[k]/max*100)+"%;background:"+l.col}),h("div",{class:"paid",style:"width:"+(paid/max*100)+"%"})))));
    paidNote.textContent="Čárkovaná čára = kolik jsi celkem vložil(a): "+kc(paid)+"."+(st.real?" Částky jsou přepočtené na dnešní ceny při inflaci 3 % ročně, proto peníze pod polštářem ztrácejí hodnotu.":"");
  }
  pmI.oninput=()=>{st.pm=+pmI.value;draw()};yrI.oninput=()=>{st.yrs=+yrI.value;draw()};realI.onchange=()=>{st.real=realI.checked;draw()};
  // challenge
  const target=fv(1,.07,20);const answer=Math.round(1e6/target);
  const gI=h("input",{type:"range",id:"guess",min:500,max:10000,step:100,value:5000});const gO=h("output",{for:"guess"},kc(5000));
  gI.oninput=()=>gO.textContent=kc(+gI.value);
  const res=h("div");
  const goBtn=h("button",{class:"btn coin",onclick:()=>{
    const g=+gI.value;const off=Math.round(Math.abs(g-answer)/answer*100);const prev=store.get("urok",null);if(prev===null||off<prev)store.set("urok",off);
    const got=fv(g,.07,20);
    goBtn.disabled=true;gI.disabled=true;
    const first=!store.get("urokPlayed",false);store.set("urokPlayed",true);
    const coins=award(first?(off<=5?40:off<=15?25:off<=30?10:5):2,first?"Hádanka":"Hádanka (opakovaná)",[first&&off<=5?"oracle":null]);
    res.replaceChildren(earnedPill(coins),h("div",{class:"explain"},h("p",{},"Správně je zhruba ",h("b",{},kc(answer))," měsíčně. Za 20 let vložíš jen "+kc(answer*240)+", zbytek do milionu dodá složené úročení."),
      h("p",{},"S tvým tipem "+kc(g)+" bys měl(a) "+kc(got)+". Odchylka "+off+" %."+(off<=10?" Výborný odhad!":g>answer?" Většina lidí sílu času podceňuje.":"")),
      h("p",{class:"small"},"Pozor: 7 % je dlouhodobý průměr, akcie v některých letech i hodně klesají. Proto se do nich ukládají peníze, které nebudeš pár let potřebovat.")));
  }},"Ukaž výsledek");
  $app.replaceChildren(bar([]),
    h("div",{class:"card"},h("h2",{},"Úrokový závod"),h("p",{class:"lead"},"Tři dráhy, stejné peníze. Rozdíl dělá jen to, kde leží. Hýbej posuvníky."),
      h("div",{class:"row"},h("div",{class:"ctrl"},h("label",{for:"pm"},"Spořím měsíčně",pmO),pmI),h("div",{class:"ctrl"},h("label",{for:"yrs"},"Jak dlouho",yrO),yrI)),
      h("label",{for:"real",style:"display:flex;gap:10px;align-items:center;font-weight:800"},realI,"Ukázat v dnešních cenách (započítat inflaci)"),
      lanes,paidNote),
    h("div",{class:"card"},h("span",{class:"tag"},"Hádanka"),h("h2",{},"Kolik měsíčně na milion?"),
      h("p",{},"Chceš mít za 20 let 1 000 000 Kč. Spoříš do fondu s průměrným výnosem 7 % ročně. Kolik musíš posílat každý měsíc?"),
      h("div",{class:"ctrl"},h("label",{for:"guess"},"Můj tip",gO),gI),
      h("p",{class:"small"},"Plné mince jen za první pokus: až 40 za trefu do 5 %."),goBtn,res),
    h("p",{class:"foot"},"Zjednodušený výpočet: měsíční vklady, stálý výnos, bez poplatků a daní. Skutečné výnosy kolísají."));

function newRace(){const qo=shuffle(RQ.map((_,k)=>k));return{pos:0,cash:6000,salary:28000,exp:[{n:"Nájem a energie",amt:10000,id:"najem"},{n:"Jídlo",amt:4000,id:"jidlo"},{n:"Splátka auta",amt:3000,debt:36000,id:"auto"},{n:"Telefon a ostatní",amt:1000,id:"ost"}],assets:[],months:0,rolls:0,ok:0,bad:0,coins:0,qo,qi:0,log:["Start. Výplata 28 000 Kč, výdaje 18 000 Kč. Cíl: pasivní příjem vyšší než výdaje."],die:null}}
function gameRace(){
  let S=store.get("race",null);if(!S||S.won)S=newRace();

    h("p",{class:"foot"},"Výnosy jsou ve hře výrazně zrychlené, aby se dala dohrát za pár minut. Ve skutečnosti trvá cesta k finanční nezávislosti roky, ale princip je stejný: méně výdajů, víc aktiv."));

    const cells=TILES.split("").map((t,k)=>h("div",{class:"sq "+t+(k===S.pos?" here":""),style:"grid-row:"+(POS[k][0]+1)+";grid-column:"+(POS[k][1]+1)},
      h("span",{class:"si","aria-hidden":"true"},TINFO[t][0]),TINFO[t][1],k===S.pos?h("span",{class:"token","aria-label":"Tvoje figurka"}):null));
    const rollBtn=h("button",{class:"btn coin",onclick:roll,disabled:busy||null},"Hodit kostkou");

      h("div",{class:"free-num"},kc(pas)+" / "+kc(ex)),h("div",{class:"small",style:"font-size:.75rem"},"pasivní příjem / výdaje"),

      h("table",{},h("tbody",{},row("Mzda",kc(S.salary)),...S.assets.map(x=>row(x.n,"+"+kc(x.inc))),h("tr",{class:"tot"},h("td",{},"Pasivní příjem"),h("td",{style:"color:var(--mint)"},kc(pas))))),
      h("table",{},h("tbody",{},...S.exp.map(x=>row(x.n,kc(x.amt),x.debt?h("button",{class:"mini",disabled:(S.cash<x.debt||busy)||null,title:"Zbývá doplatit "+kc(x.debt),onclick:()=>payOff(x.id)},"Splatit "+kc(x.debt)):null)),h("tr",{class:"tot"},h("td",{},"Výdaje celkem"),h("td",{style:"color:var(--bad)"},kc(ex)))))),
      h("p",{},"Každou výplatu ti zbude ",h("b",{},kc(S.salary+pas-ex)),". Splacením dluhu snížíš výdaje, nákupem aktiv zvýšíš pasivní příjem."),
      h("div",{class:"row"},h("button",{class:"btn line",style:"min-height:44px",onclick:restart},"Nová hra"))));
    logBox.replaceChildren(h("div",{class:"card"},h("h3",{},"Deník"),h("div",{class:"log"},...S.log.map(t=>h("div",{},t)))));
  }
  function restart(){openSheet(h("h2",{},"Začít znovu?"),h("p",{},"Současná hra se smaže. Mince, které už máš, ti zůstanou."),
    h("div",{class:"row"},h("button",{class:"btn",onclick:()=>{closeSheet();S=newRace();save();draw()}},"Ano, nová hra"),h("button",{class:"btn line",onclick:closeSheet},"Ne")))}
  function payOff(id){const x=S.exp.find(e=>e.id===id);if(!x||S.cash<x.debt)return;S.cash-=x.debt;S.exp=S.exp.filter(e=>e!==x);log("Splaceno: "+x.n+". Výdaje klesly o "+kc(x.amt)+" měsíčně.");save();if(!checkWin())draw()}
  function cover(){if(S.cash>=0)return;const loan=Math.ceil(-S.cash/1000)*1000;S.cash+=loan;S.exp.push({n:"Splátka půjčky",amt:loan/10,debt:loan,id:"p"+Date.now()});log("Nemáš na to. Půjčka "+kc(loan)+", splátka "+kc(loan/10)+" měsíčně.")}
  function payday(){S.months++;const net=S.salary+passive()-expenses();S.cash+=net;cover();log("Výplata: "+(net>=0?"+":"")+kc(net)+" (měsíc "+S.months+").")}
  function roll(){

      if(left>0)setTimeout(step,reduce?0:230);else setTimeout(land,reduce?0:250)};
    setTimeout(step,reduce?0:200);
  }
  function done(){busy=false;save();if(!checkWin())draw()}
  function nextQ(){if(S.qi>=S.qo.length){S.qo=shuffle(RQ.map((_,k)=>k));S.qi=0}const q=RQ[S.qo[S.qi++]];const idx=shuffle(q.o.map((_,k)=>k));return{...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)}}
  function ask(title,intro,onRes){

    const btns=q.o.map((t,k)=>h("button",{class:"choice",onclick:()=>{

      const ok=k===q.a;if(ok){S.ok++;S.coins+=3;award(3,"Krysí závod",[],true)}else S.bad++;

      fb.scrollIntoView({block:"nearest"});

  }
  function result(title,text,extra){openSheet(h("span",{class:"tag"},title),h("p",{},text),extra||null,h("button",{class:"btn",onclick:()=>{closeSheet();done()}},"Pokračovat"))}
  function land(){

    if(t==="V"){busy=false;save();if(!checkWin())draw();return}
    if(t==="K")return ask("Kvíz",[h("p",{},"Správná odpověď = bonus 2 000 Kč.")],ok=>{if(ok){S.cash+=2000;log("Kvíz: +2 000 Kč.")}else log("Kvíz: bez bonusu.");closeSheet();done()});
    if(t==="U"){const e=EVENTS[Math.floor(Math.random()*EVENTS.length)];
      if(e.c){S.cash+=e.c;cover()}if(e.rent){S.exp.find(x=>x.id==="najem").amt+=e.rent}if(e.sal)S.salary+=e.sal;
      log("Událost: "+e.n+".");return result("Nečekaná událost",e.n+". "+e.d,S.exp.some(x=>x.n==="Splátka půjčky")&&e.c<0?h("p",{class:"small"},"Bez rezervy tě nečekané výdaje ženou do dluhů. Proto se vyplatí mít hotovost stranou."):null)}
    if(t==="L"){const m=TEMPTS[Math.floor(Math.random()*TEMPTS.length)];
      const stake=m.perm?"+"+kc(m.perm)+" k výdajům každý měsíc":kc(m.full);
      return ask("Lákadlo",[h("h2",{},m.n),h("p",{},m.d),h("p",{class:"explain"},"Odpověz správně a odoláš"+(m.cheap?" (zaplatíš jen levnější variantu "+kc(m.cheap)+")":"")+". Špatně: "+stake+".")],ok=>{
        closeSheet();
        if(ok){if(m.cheap){S.cash-=m.cheap;cover()}log("Lákadlo "+m.n+": odolal(a) jsi.")}
        else{if(m.perm)S.exp.push({n:m.pn,amt:m.perm,debt:m.debt,id:"t"+Date.now()});else{S.cash-=m.full;cover()}log("Lákadlo "+m.n+": "+stake+".")}
        done()})}
    if(t==="P"){
      ask("Příležitost",[h("p",{},"Než do něčeho vložíš peníze, musíš tomu rozumět. Odpověz správně a uvidíš nabídku.")],ok=>{
        if(!ok){closeSheet();log("Příležitost ti utekla.");return result("Příležitost","Než jsi pochopil(a), o co jde, obchod koupil někdo jiný.")}
        if(Math.random()<.22){const s=SCAMS[Math.floor(Math.random()*SCAMS.length)];const cost=Math.min(s.cost,Math.max(S.cash,1000));
          openSheet(h("span",{class:"tag"},"Nabídka"),h("div",{class:"deal"},h("h3",{},s.n),h("p",{},s.d),h("div",{class:"nums"},h("span",{},"Vklad ",h("b",{},kc(cost))))),
            h("div",{class:"row"},
              h("button",{class:"btn coin",disabled:S.cash<cost||null,onclick:()=>{S.cash-=cost;log("Podvod "+s.n+": −"+kc(cost)+".");closeSheet();result("Byl to podvod","Peníze jsou pryč. "+s.why)}},"Investovat"),
              h("button",{class:"btn line",onclick:()=>{S.coins+=5;award(5,"Odhalený podvod",[],true);log("Odhalen podvod: "+s.n+".");closeSheet();result("Dobrý instinkt","Byl to podvod. "+s.why+" Bonus 5 mincí.")}},"Nechci")));
          return}
        const aff=DEALS.filter(x=>x.cost<=S.cash);const pick=aff.length?aff[Math.max(0,aff.length-1-Math.floor(Math.random()*2))]:DEALS[Math.floor(Math.random()*3)];
        const can=S.cash>=pick.cost;
        openSheet(h("span",{class:"tag"},"Nabídka"),h("div",{class:"deal"},h("h3",{},pick.n),h("p",{},pick.d),
            h("div",{class:"nums"},h("span",{},"Cena ",h("b",{},kc(pick.cost))),h("span",{},"Příjem ",h("b",{style:"color:var(--mint)"},"+"+kc(pick.inc)+" měsíčně")),h("span",{},"Návratnost ",h("b",{},Math.round(pick.cost/pick.inc)+" měsíců")))),
          can?null:h("p",{class:"explain"},"Na tohle zatím nemáš. Šetři hotovost na další příležitost."),
          h("div",{class:"row"},
            h("button",{class:"btn coin",disabled:!can||null,onclick:()=>{S.cash-=pick.cost;S.assets.push({n:pick.n,inc:pick.inc});log("Koupeno: "+pick.n+" (+"+kc(pick.inc)+" měsíčně).");closeSheet();done()}},"Koupit"),
            h("button",{class:"btn line",onclick:()=>{closeSheet();log("Nabídku jsi nechal(a) být.");done()}},can?"Nechat být":"Zavřít")));
      });return}
  }
  function checkWin(){
    if(passive()<expenses())return false;

    const got=award(100,"Útěk z krysího závodu",["free",m<=15?"fast":null]);
    $app.replaceChildren(bar([stat("Měsíců",String(m)),stat("Správně",S.ok+" / "+(S.ok+S.bad),"good")]),
